name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      # Mirrors `make check`; the coverage threshold comes from pyproject.toml.
      - run: uv run pytest --cov
      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
            uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage data was collected." >> "$GITHUB_STEP_SUMMARY"
          fi
