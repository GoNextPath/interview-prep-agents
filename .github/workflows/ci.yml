name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: Publish the coverage summary
        if: always()
        run: |
          {
            echo "### Test coverage (Python ${{ matrix.python-version }})"
            echo
            python -m coverage report --format=markdown || echo "No coverage data was collected."
          } >> "$GITHUB_STEP_SUMMARY"
