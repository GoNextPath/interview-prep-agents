name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      # dev contains test/lint tools; provider and tracing SDKs remain optional.
      # Install both extras so SDK/telemetry tests run instead of being skipped.
      # Tests use fake transports/exporters and block network access; no keys needed.
      - run: uv sync --locked --extra dev --extra openai --extra telemetry
      - run: uv run --locked ruff check .
      - name: Offline unit and recorded-transport tests
        run: uv run --locked pytest tests

  minimal-client:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      # Keep optional SDKs absent to verify the minimal, credential-free install.
      - run: uv sync --locked --extra dev
      - name: Verify credential-free client imports without optional SDKs
        run: >-
          uv run --locked pytest tests/test_pipeline.py tests/test_question_generator.py
          tests/test_answer_evaluator.py tests/test_feedback.py tests/test_metrics.py
          tests/test_telemetry.py::test_error_context_without_telemetry
